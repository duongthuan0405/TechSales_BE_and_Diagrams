name: Continous Delivery

on:  
  workflow_dispatch:
    inputs:
      imageTag: 
        required: true
jobs:
  build-and-test:
    name: "Build and test project"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      working-directory: ./TechSalesManagement_v2/WebAPI
      run: dotnet restore
    - name: Build
      working-directory: ./TechSalesManagement_v2/WebAPI
      run: dotnet build --no-restore
    - name: Test
      run: echo "Testing ..."

  build-and-push-image-to-registry:
    name: "Build and push image to registry"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - uses: actions/checkout@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}
    - name: Build and push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: ./TechSalesManagement_v2
        file: ./TechSalesManagement_v2/Docker/Dockerfile
        push: true
        tags: |
          ${{secrets.DOCKER_HUB_USERNAME}}/${{secrets.REPO_NAME}}:latest
          ${{secrets.DOCKER_HUB_USERNAME}}/${{secrets.REPO_NAME}}:${{github.sha}}
    
  deployment:
    name: "Deployment"
    runs-on: ubuntu-latest
    needs: build-and-push-image-to-registry
    steps:
      - run: echo "Deployment is processing ..."


