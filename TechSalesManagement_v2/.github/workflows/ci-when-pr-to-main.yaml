name: CI when a PULL REQUEST to main created

on:
  pull_request:
    branches: 
      - v2/main

jobs:
  build-and-test:
    name: "Build and test project"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      working-directory: ./WebAPI
      run: dotnet restore
    - name: Build
      working-directory: ./WebAPI
      run: dotnet build --no-restore
    - name: Test
      run: echo "Testing ..."

  containerize-and-push-to-registry:
    name: "Containerize and push to registry"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}
    - name: Build and push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Docker/Dockerfile
        push: true
        tags: |
          ${{secrets.DOCKER_HUB_USERNAME}}/${{secrets.REPO_NAME}}:latest
          ${{secrets.DOCKER_HUB_USERNAME}}/${{secrets.REPO_NAME}}:${{github.sha}}
          


